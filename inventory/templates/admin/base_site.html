{% extends "admin/base_site.html" %}

{% block branding %}
    <!-- Panelin sol üst köşesindeki ana başlığı değiştirir -->
    <h1 id="site-name">
        <a href="{% url 'admin:index' %}">🎮 Game Store Management Panel</a>
    </h1>
{% endblock %}

{% block extrastyle %}
    <!-- Buraya kendi CSS kodlarınızı yazıp renkleri değiştirebilirsiniz -->
    <style>
        /* Üst barın arka plan rengini koyu gri/lacivert yapalım */
        #header { 
            background-color: #2c3e50; 
        } 
        /* Başlık yazısının rengini yeşil yapalım */
        #branding h1, #branding h1 a:link, #branding h1 a:visited { 
            color: #27ae60; 
        }
        /* Alt kısımdaki yol çubuğunun rengini değiştirelim */
        div.breadcrumbs {
            background-color: #34495e;
        }
        /* Tablo başlıklarının rengini değiştirelim */
        .module h2, .module caption, .inline-group h2 {
            background-color: #2c3e50;
        }
        /* Buton rengini değiştirelim */
        .button, input[type=submit], input[type=button], .submit-row input, a.button {
            background: #27ae60;
        }
    </style>
{% endblock %}
