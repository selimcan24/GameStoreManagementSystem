<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Checkout | Nexus Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>body { background-color: #121212; }</style>
</head>
<body>
<div class="container mt-5 pt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card bg-dark border-secondary shadow-lg rounded-4">
                <div class="card-header bg-black border-secondary py-3 text-center rounded-top-4">
                    <h4 class="mb-0 text-success"><i class="bi bi-credit-card-fill"></i> Secure Checkout</h4>
                </div>
                <div class="card-body p-4">
                    
                    <div class="alert alert-secondary border-secondary bg-black text-light mb-4">
                        <h5 class="alert-heading">Order Summary</h5>
                        <hr class="border-secondary">
                        <div class="d-flex justify-content-between">
                            <span>1x <strong>{{ product.name }}</strong></span>
                            <span class="text-success fw-bold">${{ product.sale_price }}</span>
                        </div>
                    </div>

                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label text-muted small">Cardholder Name</label>
                            <input type="text" class="form-control bg-dark text-light border-secondary" placeholder="Jane Doe" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small">Card Number</label>
                            <input type="text" class="form-control bg-dark text-light border-secondary" placeholder="0000 0000 0000 0000" required>
                        </div>
                        <div class="row mb-4">
                            <div class="col-6">
                                <label class="form-label text-muted small">Expiry (MM/YY)</label>
                                <input type="text" class="form-control bg-dark text-light border-secondary" placeholder="12/25" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label text-muted small">CVV</label>
                                <input type="password" class="form-control bg-dark text-light border-secondary" placeholder="***" required>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="{% url 'product_list' %}" class="btn btn-outline-secondary px-4"><i class="bi bi-arrow-left"></i> Cancel</a>
                            <button type="submit" class="btn btn-success px-4 fw-bold"><i class="bi bi-lock-fill"></i> Pay ${{ product.sale_price }}</button>
                        </div>
                    </form>
                    
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
