<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add New Game</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .form-container { background-color: #1e2124; border: 1px solid #2f3136; border-radius: 10px; padding: 30px; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

    <div class="container" style="max-width: 600px;">
        <div class="form-container shadow-lg">
            <h2 class="mb-4 text-center fw-bold text-primary">➕ Add New Game</h2>
            <p class="text-secondary text-center mb-4">The cover art will be fetched automatically from RAWG.</p>
            
            <form method="POST">
                {% csrf_token %}
                
                {{ form.as_p }}
                
                <div class="d-flex justify-content-between mt-5">
                    <a href="{% url 'product_list' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                    <button type="submit" class="btn btn-success px-5 fw-bold">Save Game</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
