<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Game</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Add New Game to Inventory</h4>
                </div>
                <div class="card-body">
                    <!-- The Form -->
                    <form method="POST">
                        {% csrf_token %} <!-- SECURITY FEATURE: Django requires this to prevent hacking -->
                        
                        {{ form.as_p }} <!-- This renders all the fields we defined in forms.py -->
                        
                        <div class="mt-4">
                            <button type="submit" class="btn btn-success">Save Game</button>
                            <a href="{% url 'product_list' %}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
