<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Game</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .form-container { background-color: #1e2124; border: 1px solid #2f3136; border-radius: 10px; padding: 30px; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

    <div class="container" style="max-width: 500px;">
        <div class="form-container shadow-lg text-center">
            <h2 class="mb-3 fw-bold text-danger">⚠️ Confirm Deletion</h2>
            <p class="text-light mb-4">
                Are you absolutely sure you want to delete <strong>"{{ product.name }}"</strong> from the database? <br>
                <span class="text-secondary small">This action cannot be undone.</span>
            </p>
            
            <form method="POST">
                {% csrf_token %}
                <div class="d-flex justify-content-between mt-4">
                    <a href="{% url 'product_list' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                    <button type="submit" class="btn btn-danger px-4 fw-bold">Yes, Delete Game</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
