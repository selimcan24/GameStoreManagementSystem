<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Game</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="alert alert-danger shadow-sm">
                <h2 class="alert-heading mb-3">Wait! Are you sure?</h2>
                <p>You are about to permanently delete <strong>{{ product.name }}</strong> from the inventory.</p>
                <p>This action cannot be undone.</p>
                
                <hr>
                
                <!-- Notice we use POST here for security -->
                <form method="POST">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger me-2">Yes, Delete Game</button>
                    <a href="{% url 'product_list' %}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
