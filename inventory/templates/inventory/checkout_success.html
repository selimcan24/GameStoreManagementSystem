<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Success | Nexus Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background-color: #121212; color: white; }</style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 text-center">
    <div>
        <h1 class="text-success mb-4">Payment Successful!</h1>
        <p>Thank you for your purchase of <strong>{{ product.name }}</strong>.</p>
        <p class="text-muted">Your digital key will be sent to your email.</p>
        <a href="{% url 'product_list' %}" class="btn btn-primary mt-4">Return to Store</a>
    </div>
</body>
</html>
