<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Business Analytics | Nexus Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #121212; color: #ffffff; }
        .stat-card { border: 1px solid #333; background-color: #1a1a1a; }
        .chart-container { background-color: #1a1a1a; border: 1px solid #333; padding: 20px; border-radius: 10px; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-black shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand text-primary fw-bold" href="{% url 'product_list' %}">🎮 NEXUS STORE</a>
        <a href="{% url 'product_list' %}" class="btn btn-sm btn-outline-light"><i class="bi bi-arrow-left"></i> Back to Store</a>
    </div>
</nav>

<div class="container mb-5">
    
    <div class="d-flex justify-content-between align-items-center mb-5">
        <div>
            <h1 class="mb-0 text-white fw-bold">Financial Analytics</h1>
            <p class="text-muted mb-0">Real-time store performance reports</p>
        </div>
        <a href="{% url 'export_sales_excel' %}" class="btn btn-success btn-lg fw-bold shadow">
            <i class="bi bi-file-earmark-excel-fill"></i> Export to Excel
        </a>
    </div>

    <div class="row mb-5">
        <div class="col-md-6 mb-3">
            <div class="card stat-card p-4 rounded-3 text-center shadow-sm">
                <h6 class="text-muted text-uppercase mb-2 small font-monospace">Gross Revenue</h6>
                <h2 class="text-success fw-bold mb-0">${{ total_revenue|floatformat:2 }}</h2>
            </div>
        </div>
        <div class="col-md-6 mb-3">
            <div class="card stat-card p-4 rounded-3 text-center shadow-sm">
                <h6 class="text-muted text-uppercase mb-2 small font-monospace">Transactions Processed</h6>
                <h2 class="text-primary fw-bold mb-0">{{ total_sales_count }} Units</h2>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-7 mb-4">
            <div class="chart-container shadow-sm h-100">
                <h5 class="text-light mb-4"><i class="bi bi-bar-chart-line-fill text-primary"></i> Revenue Breakdown per Game</h5>
                <canvas id="columnChart" style="max-height: 350px;"></canvas>
            </div>
        </div>

        <div class="col-md-5 mb-4">
            <div class="chart-container shadow-sm h-100">
                <h5 class="text-light mb-4"><i class="bi bi-pie-chart-fill text-info"></i> Share of Units Sold by Genre</h5>
                <canvas id="pieChart" style="max-height: 350px;"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    // 1. Data preparation for Column Chart
    const gameLabels = [];
    const gameData = [];
    {% for sale in game_sales %}
        gameLabels.push("{{ sale.product__name }}");
        gameData.push({{ sale.total_revenue }});
    {% endfor %}

    // 2. Data preparation for Pie Chart
    const genreLabels = [];
    const genreData = [];
    {% for sale in genre_sales %}
        genreLabels.push("{{ sale.product__category__name|default:'Uncategorized' }}");
        genreData.push({{ sale.units_sold }});
    {% endfor %}

    // 3. Generating the Column Chart
    new Chart(document.getElementById('columnChart'), {
        type: 'bar',
        data: {
            labels: gameLabels,
            datasets: [{
                label: 'Revenue ($)',
                data: gameData,
                backgroundColor: 'rgba(13, 110, 253, 0.75)',
                borderColor: '#0d6efd',
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            scales: { y: { beginAtZero: true } }
        }
    });

    // 4. Generating the Pie Chart
    new Chart(document.getElementById('pieChart'), {
        type: 'pie',
        data: {
            labels: genreLabels,
            datasets: [{
                data: genreData,
                backgroundColor: [
                    '#0dcaf0', '#ffc107', '#198754', '#dc3545', '#6f42c1', '#fd7e14'
                ]
            }]
        },
        options: { responsive: true }
    });
</script>

</body>
</html>
